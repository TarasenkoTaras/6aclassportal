<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>6-А ПОРТАЛ | MEGA MOTION V4.0</title>
    <link rel="shortcut icon" href="favicon.png" type="image/png">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --green: #3EE35C;
            --blue: #00f2fe;
            --bg: #050505;
            --card: rgba(255, 255, 255, 0.03);
            --border: rgba(62, 227, 92, 0.2);
            --text: #ffffff;
            --red: #ff4d4d;
        }

        /* --- АНІМАЦІЇ --- */
        @keyframes entrance {
            0% { opacity: 0; transform: translateY(50px) scale(0.9) rotateX(-20deg); }
            100% { opacity: 1; transform: translateY(0) scale(1) rotateX(0deg); }
        }
        
        @keyframes floating {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            33% { transform: translateY(-5px) rotate(0.5deg); }
            66% { transform: translateY(2px) rotate(-0.5deg); }
        }

        @keyframes glowScan { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }

        body {
            margin: 0; padding: 0; background: var(--bg);
            background-image: radial-gradient(circle at 10% 10%, #0d1a0d 0%, transparent 40%),
                              radial-gradient(circle at 90% 90%, #05121a 0%, transparent 40%);
            color: var(--text); font-family: 'Inter', -apple-system, sans-serif;
            display: flex; flex-direction: column; align-items: center; min-height: 100vh;
            overflow-x: hidden; -webkit-tap-highlight-color: transparent;
        }

        #app-root { width: 100%; max-width: 480px; padding: 20px; box-sizing: border-box; perspective: 1000px; }

        .header { 
            display: flex; justify-content: space-between; align-items: center; 
            margin-bottom: 30px; animation: entrance 0.6s backwards, floating 4s ease-in-out infinite; 
        }
        .header h1 { font-size: 28px; font-weight: 900; background: linear-gradient(to right, var(--green), var(--blue)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin: 0; }

        .card {
            background: var(--card); border: 1px solid var(--border); backdrop-filter: blur(20px);
            border-radius: 35px; padding: 30px; text-align: center; margin-bottom: 25px;
            animation: entrance 0.8s 0.2s backwards, floating 5s ease-in-out infinite; 
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .btn-list { display: flex; flex-direction: column; gap: 15px; animation: floating 6s ease-in-out infinite; }
        
        .main-btn {
            background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: #fff;
            padding: 20px 25px; border-radius: 25px; font-size: 16px; font-weight: 800;
            cursor: pointer; transition: all 0.3s;
            display: flex; justify-content: space-between; align-items: center; text-decoration: none;
            position: relative; overflow: hidden;
        }

        .zoom-btn {
            background: linear-gradient(90deg, #00f2fe, #3EE35C, #00f2fe);
            background-size: 200% auto; border: none; color: #000;
            animation: glowScan 3s linear infinite;
            box-shadow: 0 10px 30px rgba(62, 227, 92, 0.3);
        }

        .delete-btn {
            background: rgba(255, 77, 77, 0.1); border: 1px solid var(--red); color: var(--red);
            margin-bottom: 10px; justify-content: center;
        }

        .sched-item {
            background: rgba(255,255,255,0.03); border-left: 4px solid var(--green);
            padding: 15px; border-radius: 15px; display: flex;
            justify-content: space-between; align-items: center; margin-bottom: 10px;
        }

        /* MODALS */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(15px); display: none; z-index: 9999; align-items: flex-end; }
        .modal.active { display: flex; }
        .modal-box { 
            background: #0a0a0a; width: 100%; padding: 40px 25px; 
            border-radius: 40px 40px 0 0; border-top: 4px solid var(--green); 
            box-sizing: border-box; transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.32, 1, 0.23, 1);
        }
        .modal.active .modal-box { transform: translateY(0); }

        .log-item { display: flex; align-items: center; gap: 15px; margin: 15px 0; font-size: 16px; font-weight: 600; }
        .log-dot { width: 8px; height: 8px; background: var(--green); border-radius: 50%; box-shadow: 0 0 10px var(--green); }
        
        input { width: 100%; background: #151515; border: 1px solid var(--border); border-radius: 20px; color: #fff; padding: 18px; box-sizing: border-box; outline: none; margin: 15px 0; font-size: 16px; }
        
        .progress-container { width: 100%; height: 8px; background: rgba(255,255,255,0.05); border-radius: 10px; margin-top: 20px; overflow: hidden; display: none; }
        .progress-bar { height: 100%; background: var(--green); transition: width 1s linear; }
    </style>
</head>
<body onload="checkFirstVisit()">

    <div id="app-root">
        <div class="header">
            <div onclick="openModal('updateModal')" style="cursor:pointer">
                <h1>6-А ПОРТАЛ</h1>
                <div style="font-size:10px; font-weight:900; color:var(--blue); letter-spacing:4px; opacity: 0.7;">MEGA MOTION V4.0</div>
            </div>
            <div onclick="tg.HapticFeedback.impactOccurred('medium')" style="padding:12px; background:var(--card); border:1px solid var(--border); border-radius:18px;">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--green)" stroke-width="3"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
            </div>
        </div>

        <div class="card">
            <div style="font-size: 10px; font-weight: 950; color: var(--green); letter-spacing: 3px; opacity: 0.8;">LIVE MONITOR</div>
            <div id="lessonName" style="font-size: 32px; font-weight: 900; margin: 12px 0;">АНАЛІЗ...</div>
            <div id="nextLessonHint" style="font-size: 13px; opacity: 0.5;">чекайте...</div>
            <div class="progress-container" id="progCont"><div class="progress-bar" id="progBar"></div></div>
        </div>

        <div class="btn-list">
            <a id="zoomBtn" href="#" target="_blank" class="main-btn zoom-btn">ШВИДКЕ ПРИЄДНАННЯ ⚡</a>
            <button class="main-btn" onclick="openModal('excuseModal')">ГЕНЕРАТОР ВІДМАЗОК ✨</button>
            <button class="main-btn" onclick="openModal('timerModal')">ДО КІНЦЯ УРОКУ <span id="miniTimer" style="color:var(--green);">00:00</span></button>
            <button class="main-btn" onclick="toggleSchedule()">МЕНЕДЖЕР РОЗКЛАДУ 📅</button>
            <div id="fullSchedule" style="display:none; flex-direction: column; gap: 5px;"></div>
        </div>
    </div>

    <div id="updateModal" class="modal">
        <div class="modal-box">
            <h3 style="margin:0; opacity:0.6; font-size:14px;">Невелике оновлення</h3>
            <h1 style="margin:5px 0 25px 0; font-size:42px; font-weight:900; color:var(--green);">v4.0</h1>
            <div class="log-item"><div class="log-dot"></div> Нові анімації плавання</div>
            <div class="log-item"><div class="log-dot"></div> Швидке приєднання до ZOOM</div>
            <div class="log-item"><div class="log-dot"></div> Редактор посилань</div>
            <div style="margin-top:20px; opacity:0.5; font-size:13px;">...та ще кілька змін!</div>
            <button class="main-btn zoom-btn" onclick="closeAllModals()" style="justify-content:center; color:#000; margin-top:30px; font-size:20px;">ПРИЙНЯТИ! 🚀</button>
        </div>
    </div>

    <div id="editModal" class="modal">
        <div class="modal-box">
            <div id="targetSubject" style="color:var(--green); font-weight:900; font-size: 24px;">...</div>
            <input type="text" id="linkInput" placeholder="Вставте посилання...">
            <button class="main-btn delete-btn" onclick="deleteLink()">ВИДАЛИТИ ПОСИЛАННЯ 🗑️</button>
            <button class="main-btn zoom-btn" onclick="saveZoomLink()" style="justify-content:center; color:#000;">ЗБЕРЕГТИ ✅</button>
            <button class="main-btn" onclick="closeAllModals()" style="border:none; background:none; justify-content:center; opacity:0.5;">← НАЗАД</button>
        </div>
    </div>

    <div id="excuseModal" class="modal"><div class="modal-box"><div id="excuseText" style="font-size:24px; text-align:center; padding:20px;">...</div><button class="main-btn zoom-btn" onclick="generateExcuse()" style="justify-content:center; color:#000;">ГЕНЕРУВАТИ ✨</button><button class="main-btn" onclick="closeAllModals()" style="border:none; background:none; justify-content:center;">← НАЗАД</button></div></div>
    
    <div id="timerModal" class="modal"><div class="modal-box"><div id="countdownTimer" style="font-size:80px; text-align:center; color:var(--green); font-family:monospace;">00:00</div><button class="main-btn zoom-btn" onclick="closeAllModals()" style="justify-content:center; color:#000;">ЗРОЗУМІЛО</button></div></div>

    <script>
        const tg = window.Telegram.WebApp;
        const slots = [{s:"08:15", e:"08:55"}, {s:"09:00", e:"09:40"}, {s:"09:50", e:"10:30"}, {s:"10:40", e:"11:20"}, {s:"11:40", e:"12:20"}, {s:"12:30", e:"13:10"}, {s:"13:20", e:"14:00"}, {s:"14:10", e:"14:50"}];
        const schedule = {
            1: ["математика", "історія", "укр.мова", "укр.мова", "заруб. літ-ра", "музика", "математика", "природа"],
            2: ["математика", "укр. літ-ра", "громад. освіта", "англ. мова", "англ. мова", "заруб. літ-ра", "інформатика"],
            3: ["математика", "інформатика", "географія", "укр.мова", "укр.мова", "історія", "хореограф"],
            4: ["математика", "укр. літ-ра", "здоров'я", "англ. мова", "англ. мова", "фізкультура"],
            5: ["-", "здоров'я", "географія", "фізкультура", "природа", "технології", "англ. мова"]
        };

        let subjectToEdit = "";

        // ФУНКЦІЯ ПЕРЕВІРКИ: Показувати вікно 2 рази
        function checkFirstVisit() {
            let views = parseInt(localStorage.getItem('v4_views')) || 0;
            if (views < 2) {
                openModal('updateModal');
                localStorage.setItem('v4_views', views + 1);
            }
        }

        function update() {
            const now = new Date();
            const day = now.getDay();
            const cur = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
            let act = null, nxt = null, perc = 0;

            if (schedule[day]) {
                slots.forEach((slot, i) => {
                    const s = slot.s.split(':').reduce((h, m) => h * 3600 + m * 60);
                    const e = slot.e.split(':').reduce((h, m) => h * 3600 + m * 60);
                    if (cur >= s && cur < e) {
                        act = schedule[day][i];
                        perc = ((cur - s) / (e - s)) * 100;
                        let rem = e - cur;
                        const timeStr = Math.floor(rem/60) + ":" + (rem%60).toString().padStart(2,'0');
                        document.getElementById('miniTimer').innerText = timeStr;
                        document.getElementById('countdownTimer').innerText = timeStr;
                    }
                    if (cur < s && !nxt && schedule[day][i] !== "-") nxt = schedule[day][i];
                });
            }

            const zoomBtn = document.getElementById('zoomBtn');
            const lessonName = document.getElementById('lessonName');

            if (act && act !== "-") {
                lessonName.innerText = act.toUpperCase();
                document.getElementById('nextLessonHint').innerText = nxt ? "ДАЛІ: " + nxt.toUpperCase() : "КІНЕЦЬ УРОКІВ ✅";
                const link = localStorage.getItem('zoom_' + act);
                if (link) {
                    zoomBtn.href = link;
                    zoomBtn.className = "main-btn zoom-btn";
                    zoomBtn.innerHTML = `ТИЦЯЙ ЩОБ ПРИЄДНАТИСЯ НА УРОК : ${act.toUpperCase()} ⚡`;
                } else {
                    zoomBtn.className = "main-btn";
                    zoomBtn.innerText = "ПОСИЛАННЯ ВІДСУТНЄ ⚠️";
                }
                document.getElementById('progCont').style.display = 'block';
                document.getElementById('progBar').style.width = perc + "%";
            } else {
                lessonName.innerText = (day === 0 || day === 6) ? "ВИХІДНИЙ" : "ПЕРЕРВА";
                document.getElementById('nextLessonHint').innerText = nxt ? "НАСТУПНИЙ: " + nxt.toUpperCase() : "УРОКИ СКІНЧИЛИСЬ";
                zoomBtn.innerText = "УРОК НЕ ЙДЕ, ПОСИЛАННЯ З'ЯВИТСЯ ЗА 10 СЕК ДО ПОЧАТКУ.";
                zoomBtn.removeAttribute('href');
                document.getElementById('progCont').style.display = 'none';
            }
        }

        function toggleSchedule() {
            const s = document.getElementById('fullSchedule');
            if (s.style.display === 'none') { renderSchedule(); s.style.display = 'flex'; }
            else { s.style.display = 'none'; }
        }

        function renderSchedule() {
            const container = document.getElementById('fullSchedule');
            let uniqueSubjects = new Set();
            Object.values(schedule).forEach(day => day.forEach(sub => { if(sub !== "-") uniqueSubjects.add(sub); }));
            let html = '<div style="text-align:center; font-size:10px; opacity:0.4; margin: 15px 0;">КЛІКНИ НА LINK ЩОБ РЕДАГУВАТИ:</div>';
            uniqueSubjects.forEach(subject => {
                const hasLink = localStorage.getItem('zoom_' + subject) ? '✅' : '➕';
                html += `<div class="sched-item"><span>${subject.toUpperCase()}</span><div onclick="openEdit('${subject}')" style="font-size:11px; color:var(--green); border:1px solid var(--green); padding:5px 10px; border-radius:10px; cursor:pointer;">${hasLink} LINK</div></div>`;
            });
            container.innerHTML = html;
        }

        function openEdit(subject) {
            subjectToEdit = subject;
            document.getElementById('targetSubject').innerText = subject.toUpperCase();
            document.getElementById('linkInput').value = localStorage.getItem('zoom_' + subject) || "";
            openModal('editModal');
        }

        function saveZoomLink() {
            localStorage.setItem('zoom_' + subjectToEdit, document.getElementById('linkInput').value);
            closeAllModals();
            tg.HapticFeedback.notificationOccurred('success');
            update();
        }

        function deleteLink() {
            localStorage.removeItem('zoom_' + subjectToEdit);
            closeAllModals();
            tg.HapticFeedback.notificationOccurred('warning');
            update();
        }

        function generateExcuse() {
            const excuses = ["Вимкнули світло 🕯️", "Windows оновлюється 🔄", "Кіт перегриз кабель 🐈", "Проблеми з роутером 🌐", "Zoom глючить ❌"];
            document.getElementById('excuseText').innerText = excuses[Math.floor(Math.random()*excuses.length)];
            tg.HapticFeedback.impactOccurred('heavy');
        }

        function openModal(id) { 
            document.getElementById(id).style.display = 'flex'; 
            setTimeout(() => document.getElementById(id).classList.add('active'), 10);
            tg.HapticFeedback.impactOccurred('medium'); 
        }

        function closeAllModals() {
            document.querySelectorAll('.modal').forEach(m => {
                m.classList.remove('active');
                setTimeout(() => m.style.display = 'none', 400);
            });
        }

        setInterval(update, 1000);
        update();
        tg.expand();
    </script>
</body>
</html>
