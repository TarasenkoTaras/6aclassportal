<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>6-А ПОРТАЛ | v4.9.1 | FINAL</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --green: #3EE35C;
            --bg: #050505;
            --card: rgba(255, 255, 255, 0.03);
            --border: rgba(62, 227, 92, 0.4);
            --text: #ffffff;
            --glow: rgba(62, 227, 92, 0.3);
            --transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        body {
            margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif;
            display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow-x: hidden;
            padding-bottom: 120px; transition: 0.5s;
        }

        #bg-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }

        .reveal { opacity: 0; transform: translateY(30px); transition: var(--transition); }
        .reveal.active { opacity: 1; transform: translateY(0); }

        .header h1 { 
            margin:20px 0 0; font-size: 32px; 
            background: linear-gradient(90deg, var(--green), #fff, var(--green));
            background-size: 300% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; 
            font-weight: 900; text-align: center; animation: titleFlow 5s linear infinite;
        }
        @keyframes titleFlow { 0% { background-position: 0% 50%; } 100% { background-position: 300% 50%; } }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(1deg); }
        }

        .rank-bar { 
            background: var(--card); border: 2px solid var(--green); border-radius: 24px; 
            padding: 15px 20px; margin: 20px; display: flex; align-items: center; 
            justify-content: space-between; backdrop-filter: blur(15px);
            box-shadow: 0 0 20px var(--glow); transition: var(--transition); width: 85%;
            animation: float 6s ease-in-out infinite;
            cursor: default;
        }

        .card { 
            background: rgba(0,0,0,0.6); border: 1px solid var(--border); 
            border-radius: 30px; padding: 25px; text-align: center; margin-bottom: 20px;
            box-shadow: inset 0 0 15px var(--glow); transition: var(--transition); width: 85%; box-sizing: border-box;
            animation: float 8s ease-in-out infinite reverse;
        }

        .btn-list { display: flex; flex-direction: column; gap: 12px; width: 90%; }
        
        .main-btn { 
            background: linear-gradient(90deg, var(--bg), var(--green), var(--bg)); 
            background-size: 200% auto; border: 1px solid var(--green); 
            color: #fff; padding: 18px; border-radius: 22px; font-size: 14px; 
            font-weight: 800; cursor: pointer; transition: var(--transition); display: flex; 
            justify-content: space-between; align-items: center;
            position: relative; overflow: hidden;
        }
        
        .main-btn:active { transform: scale(0.92) rotate(-1deg); filter: brightness(1.2); }
        
        .main-btn::after {
            content: ''; position: absolute; top: 50%; left: 50%; width: 0; height: 0;
            background: rgba(255,255,255,0.2); border-radius: 50%; transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }
        .main-btn:active::after { width: 300px; height: 300px; opacity: 0; }

        .disabled-btn {
            background: rgba(255,255,255,0.03) !important; 
            border: 1px solid rgba(255,255,255,0.1) !important;
            color: rgba(255,255,255,0.2) !important; 
            cursor: not-allowed; filter: grayscale(1);
        }

        .samsung-nav {
            position: fixed; bottom: 20px; width: 92%; max-width: 450px; height: 75px;
            background: rgba(10, 10, 10, 0.9); backdrop-filter: blur(20px);
            border-radius: 28px; border: 1px solid var(--border);
            display: flex; justify-content: space-around; align-items: center; z-index: 11000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 15px var(--glow);
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: rgba(255,255,255,0.3); transition: 0.3s; flex: 1; }
        .nav-item.active { color: var(--green); filter: drop-shadow(0 0 8px var(--green)); transform: translateY(-5px); }
        .nav-item span { font-size: 10px; font-weight: 800; }

        .toast {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            padding: 15px 25px; border-radius: 20px; font-weight: 900; z-index: 30000;
            background: var(--green); color: #000; box-shadow: 0 0 30px var(--glow);
            animation: bounceIn 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55); text-align: center; width: 80%;
        }
        @keyframes bounceIn { from { top: -100px; opacity: 0; } to { top: 20px; opacity: 1; } }

        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); display: none; z-index: 10000; align-items: flex-end; opacity: 0; transition: 0.4s; }
        .modal.active { opacity: 1; }
        .modal-box { background: #080808; width: 100%; padding: 40px 25px; border-radius: 40px 40px 0 0; border-top: 3px solid var(--green); transform: translateY(100%); transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.1); box-shadow: 0 -10px 40px var(--glow); box-sizing: border-box;}
        .modal.active .modal-box { transform: translateY(0); }

        .theme-card { background: rgba(255,255,255,0.03); border: 2px solid rgba(255,255,255,0.1); padding: 15px; border-radius: 20px; text-align: center; transition: 0.3s; }
        .theme-card:active { transform: scale(0.9); }
        
        .timer-display { font-size: 48px; font-weight: 900; margin: 20px 0; color: var(--green); text-shadow: 0 0 20px var(--glow); }

        .claim-btn { width: 100%; padding: 20px; border-radius: 20px; background: var(--green); border: none; font-weight: 900; color:#000; cursor: pointer; transition: 0.3s; box-shadow: 0 5px 15px var(--glow); }
        .claim-btn:active { transform: translateY(3px); box-shadow: none; }
        .claim-btn.locked { background: #222; color: #555; cursor: not-allowed; box-shadow: none; }

        .schedule-day { margin-bottom: 15px; text-align: left; animation: slideIn 0.4s ease-out forwards; opacity: 0; }
        @keyframes slideIn { from { transform: translateX(-20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .schedule-day b { color: var(--green); display: block; margin-bottom: 5px; border-bottom: 1px solid var(--border); }
        
        /* Стилі для профілю */
        .profile-status { font-size: 50px; color: var(--green); margin-bottom: 10px; }
        .profile-username { color: rgba(255,255,255,0.5); font-size: 1.1em; margin-top: 5px; font-weight: 700; }
        .secrets-label { display: block; margin: 25px 0 8px; font-size: 13px; color: rgba(255,255,255,0.4); font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
        .secrets-area { width: 100%; height: 100px; background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: #fff; border-radius: 20px; padding: 15px; outline: none; box-sizing: border-box; resize: none; font-family: 'Inter', sans-serif; }
    </style>
</head>
<body>

                <div style="font-size:9px; opacity:0.6; font-weight:900;">RANK SYSTEM</div>

    <div id="timerModal" class="modal" onclick="closeAllModals()">
        <div class="modal-box" onclick="event.stopPropagation()" style="text-align: center;">

    <div id="rewardsModal" class="modal" onclick="closeAllModals()">
        <div class="modal-box" onclick="event.stopPropagation()" style="text-align: center;">

    <nav class="samsung-nav reveal">
        <div class="nav-item active" id="nav-home" onclick="navTo('home')">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>

        </div>

            <div id="rewardBadge" style="position:absolute; top:8px; right:25%; width:8px; height:8px; background:red; border-radius:50%; display:none; animation: pulse 1s infinite;"></div>
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l-5.5 9h11L12 2zm0 3.84L13.93 9h-3.87L12 5.84z"/></svg>

        </div>
        <div class="nav-item" id="nav-profile" onclick="openProfile()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>

    <div id="shopModal" class="modal" onclick="closeAllModals()">
        <div class="modal-box" onclick="event.stopPropagation()">
            <h2 style="color:var(--green); text-align: center;">МАРКЕТ ТЕМ</h2>

                <div class="theme-card" onclick="buyTheme('green', 0)">

    <!-- Оновлений модал профілю -->
    <div id="notesModal" class="modal" onclick="closeAllModals()">
        <div class="modal-box" onclick="event.stopPropagation()" style="text-align:center;">
            <div class="profile-status">✅</div>
            <h2 style="margin: 5px 0; color:#fff;">Ви Зареєстровані</h2>
            <div class="profile-username">@6auser</div>
            
            <label class="secrets-label">Пишіть свої секрети тут</label>
            <textarea id="userNotes" oninput="saveNotes()" class="secrets-area" placeholder="..."></textarea>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        let stats = JSON.parse(localStorage.getItem('portal_v49_stats')) || { xp: 0, lastClaim: 0 };
        let currentThemeColor = '#3EE35C';

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) entry.target.classList.add('active');
            });
        }, { threshold: 0.1 });

        document.querySelectorAll('.reveal').forEach(el => observer.observe(el));

        const timeGrid = [
            { start: "08:15", end: "08:55" }, 
            { start: "09:00", end: "09:40" }, 
            { start: "09:50", end: "10:30" }, 
            { start: "10:40", end: "11:20" }, 
            { start: "11:40", end: "12:20" }, 
            { start: "12:30", end: "13:10" }, 
            { start: "13:20", end: "14:00" }, 
            { start: "14:10", end: "14:50" }  
        ];

        const schedule = {
            1: ["математика", "історія", "укр.мова", "укр.мова", "заруб. літ-ра", "музика", "математика", "природа"],
            2: ["математика", "укр. літ-ра", "громад. освіта", "англ. мова", "англ. мова", "заруб. літ-ра", "інформатика"],
            3: ["математика", "інформатика", "географія", "укр.мова", "укр.мова", "історія", "хореограф"],
            4: ["математика", "укр. літ-ра", "здоров'я, доброб", "англ. мова", "англ. мова", "фізкультура"],
            5: ["-", "здоров'я, добробут", "географія", "фізкультура", "природа", "технології", "англ. мова"]
        };

        const dayNames = ["НЕДІЛЯ", "ПОНЕДІЛОК", "ВІВТОРОК", "СЕРЕДА", "ЧЕТВЕР", "П'ЯТНИЦЯ", "СУБОТА"];

        const scienceFacts = [
            "Мед ніколи не псується. Його знаходили їстівним у гробницях фараонів 🍯",
            "Восьминоги мають три серця та блакитну кров 🐙",
            "День на Венері довший, ніж рік на Венері 🪐",
            "Банани — це ягоди, а полуниця — ні 🍌",
            "Ейфелева вежа стає вищою на 15 см влітку через тепло 🗼",
            "Швидкість світла — 300 000 кілометрів на секунду ✨",
            "Мозок генерує енергію, щоб запалити лампочку 💡",
            "ДНК людини на 50% збігається з ДНК банана 🧬",
            "У космосі панує повна тишина 🌌",
            "Коти мають 32 м'язи у кожному вусі 🐈",
            "Гора Олімп на Марсі втричі вища за Еверест 🌋",
            "Гаряча вода може замерзнути швидше за холодну ❄️"
        ];

        function updateLiveStatus() {
            const now = new Date();
            const day = now.getDay(); 
            const currentTime = now.getHours() * 60 + now.getMinutes();
            const sec = now.getSeconds();

            const lessonLabel = document.getElementById('lessonName');
            const hintLabel = document.getElementById('nextLessonHint');
            const progBar = document.getElementById('progBar');
            
            const mClock = document.getElementById('modalTimerClock');
            const mSubject = document.getElementById('modalTimerSubject');
            const mBar = document.getElementById('modalTimerBar');

            if (day === 0 || day === 6 || !schedule[day]) {
                const txt = "ВИХІДНИЙ 🎉";
                lessonLabel.innerText = txt; mSubject.innerText = txt;
                mClock.innerText = "--:--"; return;
            }

            const today = schedule[day];
            let lastIdx = -1;
            for(let i=today.length-1; i>=0; i--) { if(today[i] && today[i] !== "-") { lastIdx = i; break; } }
            const [lastH, lastM] = timeGrid[lastIdx].end.split(':').map(Number);
            if (currentTime >= lastH * 60 + lastM) {
                lessonLabel.innerText = "УРОКИ СКІНЧИЛИСЬ ✨";
                mSubject.innerText = "ВІЛЬНИЙ ЧАС"; mClock.innerText = "FREE";
                progBar.style.width = "100%"; mBar.style.width = "100%"; return;
            }

            let active = null; let next = null;
            for (let i = 0; i < timeGrid.length; i++) {
                const [sH, sM] = timeGrid[i].start.split(':').map(Number);
                const [eH, eM] = timeGrid[i].end.split(':').map(Number);
                const start = sH * 60 + sM; const end = eH * 60 + eM;
                if (currentTime >= start && currentTime < end) { active = { name: today[i] || "Урок", start, end }; break; }
                if (currentTime < start) { next = { name: today[i] || "Наступний", start }; break; }
            }

            if (active) {
                const totalSec = (active.end - active.start) * 60;
                const elapsedSec = (currentTime - active.start) * 60 + sec;
                const remainSec = totalSec - elapsedSec;
                const min = Math.floor(remainSec / 60); const s = remainSec % 60;
                const displayTitle = (active.name === "-" || !active.name) ? "ВІЛЬНИЙ ЧАС" : active.name.toUpperCase();
                lessonLabel.innerText = displayTitle; mSubject.innerText = displayTitle;
                mClock.innerText = `${min}:${s < 10 ? '0' + s : s}`;
                const p = (elapsedSec / totalSec * 100);
                progBar.style.width = p + "%"; mBar.style.width = p + "%";
                hintLabel.innerText = `До кінця: ${min} хв`;
            } else if (next) {
                lessonLabel.innerText = "ПЕРЕРВА ☕️";
                const nextTitle = (next.name === "-" || !next.name) ? "Наступного уроку" : next.name;
                mSubject.innerText = "ДО УРОКУ: " + nextTitle.toUpperCase();
                const waitMin = next.start - currentTime - 1; const waitSec = 60 - sec;
                mClock.innerText = `${waitMin}:${waitSec < 10 ? '0' + waitSec : waitSec}`;
                progBar.style.width = "0%"; mBar.style.width = "0%";
                hintLabel.innerText = `Наступний: ${nextTitle}`;
            }
        }

        function updateRewardsBtn() {
            const btn = document.getElementById('claimBtn');
            const isReady = Date.now() - stats.lastClaim > 86400000;
            if (isReady) {
                btn.innerText = "ЗАБРАТИ +100 XP"; btn.classList.remove('locked');
                document.getElementById('rewardBadge').style.display = 'block';
            } else {
                btn.innerText = "ЩЕ НЕ ЧАС"; btn.classList.add('locked');
                document.getElementById('rewardBadge').style.display = 'none';
            }
        }

        function claimReward() {
            if (Date.now() - stats.lastClaim < 86400000) return;
            stats.xp += 100; stats.lastClaim = Date.now(); save();
            showToast("💎 +100 XP ОТРИМАНО!"); updateRewardsBtn();
        }

        function openRewards() { 
            // Закриваємо магазин перед відкриттям бонусів, якщо він відкритий
            document.querySelectorAll('.modal').forEach(m=>m.classList.remove('active'));
            setTimeout(() => {
                document.querySelectorAll('.modal').forEach(m=>m.style.display='none');
                openModal('rewardsModal'); 
                navTo('rewards'); 
                updateRewardsBtn();
            }, 300);
        }

        const allAdvices = ["Пий воду 💧", "Роби розминку 👀", "Читай книги 📚", "Менше Тік-Току 📵", "Спи 8 годин 😴", "Усміхнись собі 😊"];
        let usedAdvices = JSON.parse(localStorage.getItem('portal_used_advices')) || [];

        function openAdvice() {
            let avail = allAdvices.filter(a => !usedAdvices.includes(a));
            if (avail.length === 0) { usedAdvices = []; avail = allAdvices; }
            const pick = avail[Math.floor(Math.random() * avail.length)];
            usedAdvices.push(pick);
            localStorage.setItem('portal_used_advices', JSON.stringify(usedAdvices));
            showToast(pick);
        }

        function buyTheme(type, price) {
            if(stats.xp < price) { showToast("МАЛО XP!", "red"); return; }
            if (price > 0) { stats.xp -= price; showToast(`ЗНЯТО ${price} XP 💸`); }
            if(type === 'purple') currentThemeColor = '#bf00ff';
            else if(type === 'yellow') currentThemeColor = '#ffff00';
            else if(type === 'pink') currentThemeColor = '#ff69b4';
            else currentThemeColor = '#3EE35C';
            document.documentElement.style.setProperty('--green', currentThemeColor);
            document.documentElement.style.setProperty('--glow', currentThemeColor + '55');
            document.documentElement.style.setProperty('--border', currentThemeColor + '66');
            save(); showToast("ТЕМА ОНОВЛЕНА");
        }

        function updateUI() {
            document.getElementById('topRankDisplay').innerText = stats.xp > 1000 ? "МАЙСТЕР" : "НОВАЧОК";
            document.getElementById('topExpText').innerText = stats.xp + " XP";
            document.getElementById('topExpFill').style.width = Math.min((stats.xp/5000)*100, 100) + "%";
            updateRewardsBtn();
        }

        function save() { localStorage.setItem('portal_v49_stats', JSON.stringify(stats)); updateUI(); }

        function openFact() { 
            const randomFact = scienceFacts[Math.floor(Math.random() * scienceFacts.length)];
            stats.xp += 10; 
            save(); 
            showToast(`🧠 ФАКТ: ${randomFact}`); 
        }

        function showToast(t, b) {
            const el = document.createElement('div'); el.className='toast';
            el.style.background = b || currentThemeColor; el.innerText = t;
            document.body.appendChild(el); setTimeout(()=> {
                el.style.opacity = '0'; el.style.top = '-50px';
                setTimeout(() => el.remove(), 500);
            }, 3000);
        }

        function navTo(id) {
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            const target = document.getElementById('nav-'+id);
            if(target) target.classList.add('active');
            
            if(id === 'shop') {
                // Закриваємо інші модалки перед відкриттям магазину
                document.querySelectorAll('.modal').forEach(m => {
                    if(m.id !== 'shopModal') m.classList.remove('active');
                });
                openModal('shopModal');
            }
            if(id === 'profile') openProfile();
            if(id === 'home') closeAllModals();
        }

        function openModal(id) { 
            const m=document.getElementById(id); m.style.display='flex'; 
            setTimeout(()=>m.classList.add('active'),10); 
        }

        function closeAllModals() { 
            document.querySelectorAll('.modal').forEach(m=>m.classList.remove('active')); 
            setTimeout(()=>document.querySelectorAll('.modal').forEach(m=>m.style.display='none'),400); 
            // Скидаємо навігацію на "Дім" тільки якщо ми дійсно закриваємо все
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('nav-home').classList.add('active');
        }

        function openProfile() { openModal('notesModal'); navTo('profile'); }
        function saveNotes() { localStorage.setItem('portal_notes', document.getElementById('userNotes').value); }

        function toggleSchedule() {
            const s = document.getElementById('fullSchedule');
            if(s.style.display === 'none') {
                let h = "";
                for(let d=1; d<=5; d++){
                    h += `<div class="schedule-day" style="animation-delay: ${d*0.1}s"><b>${dayNames[d]}</b>`;
                    schedule[d].forEach((l, i)=> { if(l && l !== "-") h += `<div>${i}. ${l} <span style="opacity:0.3;font-size:9px;">(${timeGrid[i].start})</span></div>`; });
                    h += `</div>`;
                }
                s.innerHTML = h; s.style.display = 'flex';
            } else s.style.display = 'none';
        }

        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let pts = [];
        function res() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        class Pt {
            constructor() { this.reset(); this.y = Math.random()*canvas.height; }
            reset() { this.x = Math.random()*canvas.width; this.y = -20; this.s = Math.random()*2 + 1; this.sp = Math.random()*1+0.5; this.o = Math.random()*0.5; }
            up() { this.y += this.sp; if(this.y > canvas.height) this.reset(); }
            dr() { ctx.fillStyle = currentThemeColor; ctx.globalAlpha = this.o; ctx.beginPath(); ctx.arc(this.x, this.y, this.s, 0, 7); ctx.fill(); }
        }
        function init() { for(let i=0; i<40; i++) pts.push(new Pt()); }
        function anim() { ctx.clearRect(0,0,canvas.width,canvas.height); pts.forEach(p=>{p.up();p.dr();}); requestAnimationFrame(anim); }
        window.onresize = res; res(); init(); anim();

        window.onload = () => {
            document.getElementById('userNotes').value = localStorage.getItem('portal_notes') || "";
            updateUI(); setInterval(updateLiveStatus, 1000); tg.expand();
            setTimeout(() => { document.querySelectorAll('.reveal').forEach(el => el.classList.add('active')); }, 100);
        };
    </script>
</body>
</html>
