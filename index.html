<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>6-А ПОРТАЛ | v4.2 By:Tarasi4ik | FINAL</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --green: #3EE35C;
            --bg: #050505;
            --card: rgba(255, 255, 255, 0.03);
            --border: rgba(62, 227, 92, 0.4);
            --text: #ffffff;
            --glow: rgba(62, 227, 92, 0.3);
            --transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        body {
            margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif;
            display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow-x: hidden;
            padding-bottom: 120px; transition: 0.5s;
        }

        #bg-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }

        /* Вхідні анімації */
        .reveal { opacity: 0; transform: translateY(30px); transition: var(--transition); }
        .reveal.active { opacity: 1; transform: translateY(0); }

        .header h1 { 
            margin:20px 0 0; font-size: 32px; 
            background: linear-gradient(90deg, var(--green), #fff, var(--green));
            background-size: 300% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; 
            font-weight: 900; text-align: center; animation: titleFlow 5s linear infinite;
        }
        @keyframes titleFlow { 0% { background-position: 0% 50%; } 100% { background-position: 300% 50%; } }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(1deg); }
        }

        .rank-bar { 
            background: var(--card); border: 2px solid var(--green); border-radius: 24px; 
            padding: 15px 20px; margin: 20px; display: flex; align-items: center; 
            justify-content: space-between; backdrop-filter: blur(15px);
            box-shadow: 0 0 20px var(--glow); transition: var(--transition); width: 85%;
            animation: float 6s ease-in-out infinite;
        }

        .card { 
            background: rgba(0,0,0,0.6); border: 1px solid var(--border); 
            border-radius: 30px; padding: 25px; text-align: center; margin-bottom: 20px;
            box-shadow: inset 0 0 15px var(--glow); transition: var(--transition); width: 85%; box-sizing: border-box;
            animation: float 8s ease-in-out infinite reverse;
        }

        .btn-list { display: flex; flex-direction: column; gap: 12px; width: 90%; }
        
        .main-btn { 
            background: linear-gradient(90deg, var(--bg), var(--green), var(--bg)); 
            background-size: 200% auto; border: 1px solid var(--green); 
            color: #fff; padding: 18px; border-radius: 22px; font-size: 14px; 
            font-weight: 800; cursor: pointer; transition: var(--transition); display: flex; 
            justify-content: space-between; align-items: center;
            position: relative; overflow: hidden;
        }
        
        .main-btn:active { transform: scale(0.92) rotate(-1deg); filter: brightness(1.2); }

        .disabled-btn {
            background: rgba(255,255,255,0.03) !important; 
            border: 1px solid rgba(255,255,255,0.1) !important;
            color: rgba(255,255,255,0.2) !important; 
            cursor: not-allowed; filter: grayscale(1);
        }

        .samsung-nav {
            position: fixed; bottom: 20px; width: 92%; max-width: 450px; height: 75px;
            background: rgba(10, 10, 10, 0.9); backdrop-filter: blur(20px);
            border-radius: 28px; border: 1px solid var(--border);
            display: flex; justify-content: space-around; align-items: center; z-index: 11000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 15px var(--glow);
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: rgba(255,255,255,0.3); transition: 0.3s; flex: 1; }
        .nav-item.active { color: var(--green); filter: drop-shadow(0 0 8px var(--green)); transform: translateY(-5px); }
        .nav-item span { font-size: 10px; font-weight: 800; }

        .toast {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            padding: 15px 25px; border-radius: 20px; font-weight: 900; z-index: 30000;
            background: var(--green); color: #000; box-shadow: 0 0 30px var(--glow);
            animation: bounceIn 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55); text-align: center; width: 80%;
        }
        @keyframes bounceIn { from { top: -100px; opacity: 0; } to { top: 20px; opacity: 1; } }

        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); display: none; z-index: 10000; align-items: flex-end; opacity: 0; transition: 0.4s; }
        .modal.active { opacity: 1; }
        .modal-box { background: #080808; width: 100%; padding: 40px 25px; border-radius: 40px 40px 0 0; border-top: 3px solid var(--green); transform: translateY(100%); transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.1); box-shadow: 0 -10px 40px var(--glow); box-sizing: border-box;}
        .modal.active .modal-box { transform: translateY(0); }

        /* Стилі Вікна Оновлень */
        .update-modal {
            position: fixed; inset: 0; background: radial-gradient(circle at center, rgba(62, 227, 92, 0.1), #000);
            backdrop-filter: blur(25px); display: none; z-index: 50000; align-items: center; justify-content: center;
            opacity: 0; transition: 0.6s;
        }
        .update-modal.active { opacity: 1; }
        .update-card {
            background: rgba(10, 10, 10, 0.95); border: 2px solid var(--green); border-radius: 40px;
            padding: 40px 30px; width: 85%; max-width: 400px; text-align: center;
            box-shadow: 0 0 50px var(--glow); transform: scale(0.8); transition: 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .update-modal.active .update-card { transform: scale(1); }
        .accept-btn {
            margin-top: 25px; width: 100%; padding: 20px; border-radius: 22px;
            background: var(--green); color: #000; border: none; font-weight: 900; font-size: 16px;
            cursor: pointer; box-shadow: 0 10px 20px var(--glow); transition: 0.3s;
        }
        .exit-anim { transform: scale(1.5) !important; opacity: 0 !important; filter: blur(20px); }

        .timer-display { font-size: 48px; font-weight: 900; margin: 20px 0; color: var(--green); text-shadow: 0 0 20px var(--glow); }
        .claim-btn { width: 100%; padding: 20px; border-radius: 20px; background: var(--green); border: none; font-weight: 900; color:#000; cursor: pointer; transition: 0.3s; box-shadow: 0 5px 15px var(--glow); }
        .claim-btn.locked { background: #222; color: #555; cursor: not-allowed; box-shadow: none; }
        .schedule-day { margin-bottom: 15px; text-align: left; opacity: 0; }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <!-- Основний контент -->
    <div id="app-root" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
        <div class="header reveal">
            <h1>6-А ПОРТАЛ</h1>
            <div style="font-size:10px; color:var(--green); text-align:center; letter-spacing:3px; font-weight:900;">V4.2 | By Tarasi4ik</div>
        </div>

        <div class="rank-bar reveal" onclick="openProfile()">
            <div>
                <div style="font-size:9px; opacity:0.6; font-weight:900;">RANK_SYSTEM</div>
                <div id="topRankDisplay" style="font-weight:900; font-size:18px; color: var(--green);">LOADING...</div>
            </div>
            <div style="text-align:right;">
                <div id="topExpText" style="font-size:12px; font-weight:900;">0 XP</div>
                <div style="width:80px; height:4px; background:rgba(255,255,255,0.1); border-radius:10px; margin-top:5px; overflow:hidden;">
                    <div id="topExpFill" style="height:100%; background:var(--green); width:0%; transition:1.5s;"></div>
                </div>
            </div>
        </div>

        <div class="card reveal">
            <div style="font-size: 10px; font-weight: 900; color: var(--green); letter-spacing: 2px;">LIVE_STATUS</div>
            <div id="lessonName" style="font-size: 24px; font-weight: 900; margin: 10px 0;">ОНОВЛЕННЯ...</div>
            <div id="nextLessonHint" style="font-size: 12px; opacity: 0.6; min-height: 15px;">...</div>
            <div style="width:100%; height:6px; background:rgba(255,255,255,0.05); border-radius:10px; margin-top:15px; overflow:hidden;">
                <div id="progBar" style="height:100%; background:var(--green); width:0%; transition:0.8s;"></div>
            </div>
        </div>

        <div class="btn-list reveal">
            <button class="main-btn" onclick="openModal('timerModal')">ТОЧНИЙ ТАЙМЕР ⏱️</button>
            <button class="main-btn" onclick="openModal('notesModal')">МОЇ НОТАТКИ 📝</button>
            <button class="main-btn" onclick="openFact()">ІНТЕЛЕКТ-МОДУЛЬ ⚡️</button>
            <button class="main-btn" onclick="openAdvice()">ПОРАДА ДНЯ 💡</button>
            <button class="main-btn" onclick="toggleSchedule()">РОЗКЛАД ЗАНЯТЬ 📅</button>
            <div id="fullSchedule" style="display:none; flex-direction: column; gap: 8px; padding: 20px; background: rgba(0,0,0,0.7); border-radius: 20px; border: 1px solid var(--border); font-size: 13px;"></div>
        </div>
    </div>

    <!-- ВІКНО ОНОВЛЕНЬ -->
    <div id="updateNotice" class="update-modal">
        <div class="update-card" id="updateCard">
            <div style="font-size: 50px;">🚀</div>
            <h2 style="color:var(--green); margin:10px 0;">V4.2 ОНОВЛЕНО</h2>
            <p style="font-size:13px; opacity:0.7;">Ми додали систему рангів, магазин тем та покращили стабільність.</p>
            <div style="text-align:left; background:rgba(255,255,255,0.05); padding:15px; border-radius:20px; font-size:12px;">
                • Новий дизайн карток<br>• Анімація при в ході<br>• Фікс таймера уроків
            </div>
            <button class="accept-btn" onclick="acceptUpdate()">ПРИЙНЯТИ ЗМІНИ</button>
        </div>
    </div>

    <!-- Модалки -->
    <div id="timerModal" class="modal" onclick="closeAllModals()"><div class="modal-box" onclick="event.stopPropagation()" style="text-align:center;"><div id="modalTimerClock" class="timer-display">00:00</div><div id="modalTimerSubject" style="font-weight:900;">...</div></div></div>
    <div id="rewardsModal" class="modal" onclick="closeAllModals()"><div class="modal-box" onclick="event.stopPropagation()" style="text-align:center;"><div style="font-size:50px;">💎</div><button id="claimBtn" onclick="claimReward()" class="claim-btn">ЗАБРАТИ XP</button></div></div>
    <div id="notesModal" class="modal" onclick="closeAllModals()"><div class="modal-box" onclick="event.stopPropagation()"><h2 style="color:var(--green);text-align:center;">НОТАТКИ</h2><textarea id="userNotes" oninput="saveNotes()" style="width:100%;height:200px;background:rgba(0,0,0,0.5);border:1px solid var(--border);color:#fff;border-radius:20px;padding:15px;outline:none;box-sizing:border-box;"></textarea></div></div>

    <!-- Навігація -->
    <nav class="samsung-nav reveal">
        <div class="nav-item active" id="nav-home" onclick="navTo('home')">🏠<span>Дім</span></div>
        <div class="nav-item" id="nav-rewards" onclick="openRewards()">🎁<span>Бонус</span></div>
        <div class="nav-item" id="nav-profile" onclick="openProfile()">👤<span>Профіль</span></div>
    </nav>

    <script>
        const tg = window.Telegram.WebApp;
        let stats = JSON.parse(localStorage.getItem('portal_v49_stats')) || { xp: 0, lastClaim: 0 };
        let currentThemeColor = '#3EE35C';

        const timeGrid = [
            { start: "08:15", end: "08:55" }, { start: "09:00", end: "09:40" },
            { start: "09:50", end: "10:30" }, { start: "10:40", end: "11:20" },
            { start: "11:40", end: "12:20" }, { start: "12:30", end: "13:10" },
            { start: "13:20", end: "14:00" }, { start: "14:10", end: "14:50" }
        ];

        const schedule = {
            1: ["Математика", "Історія", "Укр. мова", "Укр. мова", "Заруб. літ-ра", "Музика", "Математика", "Природа"],
            2: ["Математика", "Укр. літ-ра", "Громад. освіта", "Англ. мова", "Англ. мова", "Заруб. літ-ра", "Інформатика"],
            3: ["Математика", "Інформатика", "Географія", "Укр. мова", "Укр. мова", "Історія", "Хореографія"],
            4: ["Математика", "Укр. літ-ра", "Здоров'я, добробут", "Англ. мова", "Англ. мова", "Хореографія"],
            5: ["-", "Здоров'я, добробут", "Географія", "Фізкультура", "Природа", "Технології", "Англ. мова"]
        };

        function updateLiveStatus() {
            const now = new Date();
            const day = now.getDay();
            const currentTime = now.getHours() * 60 + now.getMinutes();
            const sec = now.getSeconds();

            const lessonLabel = document.getElementById('lessonName');
            const hintLabel = document.getElementById('nextLessonHint');
            const progBar = document.getElementById('progBar');

            if (day === 0 || day === 6 || !schedule[day]) {
                lessonLabel.innerText = "ВИХІДНИЙ 🎉"; return;
            }

            const today = schedule[day];
            let active = null;
            for (let i = 0; i < today.length; i++) {
                const [sH, sM] = timeGrid[i].start.split(':').map(Number);
                const [eH, eM] = timeGrid[i].end.split(':').map(Number);
                const start = sH * 60 + sM;
                const end = eH * 60 + eM;

                if (currentTime >= start && currentTime < end) {
                    active = { name: today[i], start, end }; break;
                }
            }

            if (active) {
                lessonLabel.innerText = active.name;
                const p = (((currentTime - active.start) * 60 + sec) / ((active.end - active.start) * 60)) * 100;
                progBar.style.width = p + "%";
                hintLabel.innerText = "До кінця: " + (active.end - currentTime) + " хв";
            } else {
                lessonLabel.innerText = "ПЕРЕРВА ☕️";
                progBar.style.width = "0%";
            }
        }

        function checkUpdateNotice() {
            let visits = parseInt(localStorage.getItem('portal_visit_count')) || 0;
            if (visits < 2) {
                const modal = document.getElementById('updateNotice');
                modal.style.display = 'flex';
                setTimeout(() => modal.classList.add('active'), 100);
                localStorage.setItem('portal_visit_count', visits + 1);
            }
        }

        function acceptUpdate() {
            const modal = document.getElementById('updateNotice');
            const card = document.getElementById('updateCard');
            card.classList.add('exit-anim');
            modal.style.opacity = '0';
            setTimeout(() => { modal.style.display = 'none'; showToast("СИСТЕМУ ГОТОВО ⚡"); }, 600);
        }

        function openModal(id) { document.getElementById(id).style.display='flex'; setTimeout(()=>document.getElementById(id).classList.add('active'),10); }
        function closeAllModals() { document.querySelectorAll('.modal').forEach(m=>{m.classList.remove('active'); setTimeout(()=>m.style.display='none',400);}); }
        function navTo(id) { document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active')); if(document.getElementById('nav-'+id)) document.getElementById('nav-'+id).classList.add('active'); if(id==='home') closeAllModals(); }
        function openProfile() { openModal('notesModal'); navTo('profile'); }
        function openRewards() { openModal('rewardsModal'); navTo('rewards'); }
        function saveNotes() { localStorage.setItem('portal_notes', document.getElementById('userNotes').value); }
        function showToast(t) { const el = document.createElement('div'); el.className='toast'; el.innerText = t; document.body.appendChild(el); setTimeout(()=>el.remove(), 2500); }
        function updateUI() { document.getElementById('topRankDisplay').innerText = stats.xp > 1000 ? "МАЙСТЕР" : "НОВАЧОК"; document.getElementById('topExpText').innerText = stats.xp + " XP"; document.getElementById('topExpFill').style.width = Math.min((stats.xp/5000)*100, 100) + "%"; }
        function openFact() { stats.xp += 10; localStorage.setItem('portal_v49_stats', JSON.stringify(stats)); updateUI(); showToast("+10 XP ЗА РОЗУМ 🧠"); }
        function openAdvice() { showToast("Будь кращим сьогодні! ✨"); }

        function toggleSchedule() {
            const s = document.getElementById('fullSchedule');
            if(s.style.display === 'none') {
                s.innerHTML = "<b>РОЗКЛАД ЗАВАНТАЖЕНО</b>"; s.style.display = 'flex';
            } else s.style.display = 'none';
        }

        // Background
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let pts = [];
        function res() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        class Pt {
            constructor() { this.x = Math.random()*window.innerWidth; this.y = Math.random()*window.innerHeight; this.s = Math.random()*2; this.sp = Math.random()*0.5; }
            dr() { this.y += this.sp; if(this.y > canvas.height) this.y = -5; ctx.fillStyle = "#3EE35C"; ctx.globalAlpha = 0.3; ctx.beginPath(); ctx.arc(this.x, this.y, this.s, 0, 7); ctx.fill(); }
        }
        function anim() { ctx.clearRect(0,0,canvas.width,canvas.height); pts.forEach(p=>p.dr()); requestAnimationFrame(anim); }
        window.onresize = res; res(); for(let i=0;i<40;i++) pts.push(new Pt()); anim();

        window.onload = () => {
            document.getElementById('userNotes').value = localStorage.getItem('portal_notes') || "";
            updateUI(); setInterval(updateLiveStatus, 1000); tg.expand();
            checkUpdateNotice();
            setTimeout(() => document.querySelectorAll('.reveal').forEach(el => el.classList.add('active')), 100);
        };
    </script>
</body>
</html>
