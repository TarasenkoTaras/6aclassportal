<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>6-А ПОРТАЛ | V1.4.2 ULTRA-CORE</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --green: #3EE35C;
            --green-glow: rgba(62, 227, 92, 0.5);
            --bg: #050505;
            --card: rgba(15, 15, 15, 0.85);
            --border: rgba(62, 227, 92, 0.25);
            --text: #ffffff;
        }

        /* --- АНІМАЦІЙНИЙ ПАКЕТ --- */
        @keyframes bgMove { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        @keyframes float { 0% { transform: translateY(0px) rotate(0deg); } 50% { transform: translateY(-12px) rotate(0.5deg); } 100% { transform: translateY(0px) rotate(0deg); } }
        @keyframes reveal { 0% { opacity: 0; filter: blur(15px); transform: translateY(20px); } 100% { opacity: 1; filter: blur(0); transform: translateY(0); } }
        @keyframes glitch { 0% { text-shadow: 1px 0 0 red, -1px 0 0 blue; } 2% { transform: translate(2px, -1px); } 4% { transform: translate(-1px, 1px); } 6% { text-shadow: none; transform: translate(0,0); } 100% { text-shadow: none; } }
        @keyframes neonPulse { 0%, 100% { border-color: var(--border); box-shadow: 0 0 5px var(--green-glow); } 50% { border-color: var(--green); box-shadow: 0 0 20px var(--green-glow); } }

        body {
            margin: 0; padding: 0; background: var(--bg);
            background-image: linear-gradient(-45deg, #050505, #0d1a0d, #050505, #081208);
            background-size: 400% 400%; animation: bgMove 15s ease infinite;
            color: var(--text); font-family: 'Inter', -apple-system, sans-serif;
            display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow-x: hidden;
        }

        #app-root { width: 100%; max-width: 480px; padding: 20px; box-sizing: border-box; }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; animation: reveal 0.8s ease-out; }
        .header h1 { color: var(--green); margin: 0; font-size: 24px; font-weight: 900; animation: glitch 4s infinite; }

        .card {
            background: var(--card); border: 1px solid var(--border); backdrop-filter: blur(25px);
            border-radius: 35px; padding: 30px 20px; text-align: center; margin-bottom: 20px;
            animation: reveal 1s ease-out, float 5s infinite ease-in-out;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .ai-assistant {
            background: rgba(62, 227, 92, 0.08); border: 2px solid var(--border);
            border-radius: 25px; padding: 18px; margin-bottom: 20px;
            animation: reveal 1.2s ease-out, neonPulse 4s infinite;
        }

        .main-btn {
            background: var(--green); color: #000; border: none; padding: 20px; border-radius: 22px;
            font-size: 16px; font-weight: 900; width: 100%; cursor: pointer; text-transform: uppercase;
            margin-bottom: 12px; transition: 0.3s; box-shadow: 0 8px 20px var(--green-glow);
            animation: reveal 1.4s ease-out backwards;
        }
        .main-btn:active { transform: scale(0.95); }
        .secondary-btn { background: none; border: 2px solid var(--green); color: var(--green); box-shadow: none; animation: reveal 1.6s ease-out backwards; }

        .timer-bar {
            background: rgba(255,255,255,0.05); border: 1px dashed var(--green);
            color: #fff; padding: 18px; display: flex; border-radius: 22px;
            justify-content: space-between; align-items: center; margin-bottom: 12px;
        }

        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); backdrop-filter: blur(30px); display: none; z-index: 1000; align-items: flex-end; }
        .modal.active { display: flex; }
        .modal-box { 
            background: #0a0a0a; width: 100%; padding: 40px 20px; border-radius: 40px 40px 0 0; 
            border-top: 3px solid var(--green); text-align: center;
            animation: slideUp 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        #fullSchedule { display: grid; gap: 10px; margin-top: 15px; }
        textarea { width: 100%; background: #000; border: 1px solid var(--green); border-radius: 15px; color: var(--green); padding: 15px; box-sizing: border-box; }
    </style>
</head>
<body>

    <div id="app-root">
        <div class="header">
            <div>
                <h1>6-А ПОРТАЛ</h1>
                <div style="font-size: 10px; color: var(--green); opacity: 0.7;">ULTRA-CORE V1.4.2</div>
            </div>
            <div style="width: 45px; height: 45px; border: 2px solid var(--green); border-radius: 12px; display: flex; align-items: center; justify-content: center;" onclick="openModal('profileModal')">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--green)" stroke-width="3"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </div>
        </div>

        <div class="card">
            <div style="font-size: 11px; font-weight: 900; color: var(--green); letter-spacing: 3px;">SYSTEM ACTIVE</div>
            <div id="lessonName" style="font-size: 32px; font-weight: 950; margin: 10px 0;">АНАЛІЗ...</div>
            <div id="nextLessonHint" style="font-size: 12px; opacity: 0.4; font-weight: 700;">СИНХРОНІЗАЦІЯ ДАНИХ</div>
        </div>

        <div class="ai-assistant">
            <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 8px;">
                <div style="padding: 4px 8px; background: var(--green); border-radius: 6px; color: #000; font-weight: 950; font-size: 12px;">T4</div>
                <div style="font-size: 11px; font-weight: 900; letter-spacing: 1px; color: var(--green);">ПОМІЧНИК TARASI4IK</div>
            </div>
            <div id="aiPhrase" style="font-size: 13px; font-weight: 600; line-height: 1.4; color: #eee;">Завантажую базу порад...</div>
        </div>

        <button class="main-btn" onclick="openModal('excuseModal')">ГЕНЕРАТОР ВІДМАЗОК</button>

        <div class="timer-bar" onclick="openModal('timerModal')">
            <span style="font-weight: 800; font-size: 14px;">ЧАС ДО КІНЦЯ</span>
            <span id="miniTimer" style="color: var(--green); font-family: monospace; font-weight: 900; font-size: 18px;">00:00</span>
        </div>

        <button class="main-btn secondary-btn" onclick="toggleSection('fullSchedule')">РОЗКЛАД</button>
        <div id="fullSchedule" style="display:none;"></div>

        <button class="main-btn secondary-btn" onclick="toggleSection('intelSection')">НОТАТКИ</button>
        <div id="intelSection" style="display:none;">
            <textarea id="intelArea" rows="4" placeholder="Твій секретний текст..." oninput="saveIntel()"></textarea>
        </div>
    </div>

    <div id="timerModal" class="modal" onclick="closeModal('timerModal')">
        <div class="modal-box" onclick="event.stopPropagation()">
            <div style="font-size: 11px; font-weight: 900; color: var(--green); letter-spacing: 2px;">COUNTDOWN</div>
            <div id="countdownTimer" style="font-family: monospace; font-size: 60px; font-weight: 900; color: var(--green); text-shadow: 0 0 20px var(--green-glow);">00:00:00</div>
            <div id="endTimeLabel" style="color: #fff; font-size: 14px; font-weight: 800; opacity: 0.6; margin-bottom: 25px; border-top: 1px solid var(--border); padding-top: 10px; display: inline-block;">ЗАКІНЧЕННЯ: --:--</div>
            <button class="main-btn" onclick="closeModal('timerModal')">ЗАКРИТИ</button>
        </div>
    </div>

    <div id="excuseModal" class="modal" onclick="closeModal('excuseModal')">
        <div class="modal-box" onclick="event.stopPropagation()">
            <h2 style="color: var(--green); font-weight: 900;">ВІДМАЗКА</h2>
            <button class="main-btn" onclick="generateExcuse()">ЗГЕНЕРУВАТИ</button>
            <div id="excuseResultBlock" style="display:none; margin-top:20px; padding: 20px; border: 1px solid var(--border); border-radius: 15px;">
                <div id="excuseText" style="font-weight: 700; font-size: 16px;"></div>
            </div>
            <button class="main-btn secondary-btn" onclick="closeModal('excuseModal')" style="margin-top:20px;">ЗАКРИТИ</button>
        </div>
    </div>

    <div id="profileModal" class="modal" onclick="closeModal('profileModal')">
        <div class="modal-box" onclick="event.stopPropagation()">
            <h2 id="uName">Гість</h2>
            <p style="color: var(--green); opacity: 0.6;">Admin Access Granted</p>
            <button class="main-btn" onclick="closeModal('profileModal')">ЗАКРИТИ</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        
        const excuses = ["Зошит з'їла нейромережа.", "Файл заблокував вірус.", "Збій через Меркурій.", "Кіт ліг на зошит.", "Брат зробив літачок.", "Камера не працює.", "Зум вилетів сам.", "Глючить інтернет."];
        
        const aiPhrases = [
            "Tarasi4ik бачить: ти вже 20 хвилин слухаєш вчителя... в навушниках грає фонк, так? 😉",
            "Портал зафіксував 100% продуктивності... у Brawl Stars. Кубки самі себе не наб'ють! 🏆",
            "Порада від Tarasi4ik: якщо викликали відповідати, імітуй робота і кажи 'По-мил-ка зв'яз-ку'. 🤖",
            "Рівень інтелекту в класі впав на 40%, бо ти зараз гортаєш стрічку ТікТоку. Продовжуй! 📱",
            "Tarasi4ik просканував щоденник: там порожньо, як у холодильнику вночі. Ідеально. 💎",
            "Твій мозок зараз у режимі 'Енергозбереження'. Не турбуй його навчанням. 🔋",
            "Tarasi4ik підрахував: якщо вийти з Zoom зараз, шанс отримати 'двійку' — 50%, а шанс поїсти — 100%. 🍕",
            "Система виявила підозрілу активність: ти дивишся на вчителя довше 5 секунд. Обережно, це заразно! ⚠️",
            "Tarasi4ik рекомендує: напиши в чат 'Мене не чути?', вимкни звук і йди грати в Roblox. 🎮"
        ];

        const scheduleData = { 1: ["МАТЕМАТИКА", "ІСТОРІЯ", "УКР.МОВА", "УКР.МОВА", "ЗАРУБ. ЛІТ", "МУЗИКА", "МАТЕМАТИКА", "ПРИРОДА"], 2: ["МАТЕМАТИКА", "УКР. ЛІТ", "ГРОМАД. ОСВ", "АНГЛ. МОВА", "АНГЛ. МОВА", "ЗАРУБ. ЛІТ", "ІНФОРМАТИКА"], 3: ["МАТЕМАТИКА", "ІНФОРМАТИКА", "ГЕОГРАФІЯ", "УКР.МОВА", "УКР.МОВА", "ІСТОРІЯ", "ХОРЕОГРАФ"], 4: ["МАТЕМАТИКА", "УКР. ЛІТ", "ЗДОРОВ'Я", "АНГЛ. МОВА", "АНГЛ. МОВА", "ФІЗКУЛЬТУРА"], 5: ["-", "ЗДОРОВ'Я", "ГЕОГРАФІЯ", "ФІЗКУЛЬТУРА", "ПРИРОДА", "ТЕХНОЛОГІЇ", "АНГЛ. МОВА"] };
        const timeSlots = [{ s: "08:15", e: "08:55" }, { s: "09:00", e: "09:40" }, { s: "09:50", e: "10:30" }, { s: "10:40", e: "11:20" }, { s: "11:40", e: "12:20" }, { s: "12:30", e: "13:10" }, { s: "13:20", e: "14:00" }, { s: "14:10", e: "14:50" }];

        function generateExcuse() { document.getElementById('excuseText').innerText = excuses[Math.floor(Math.random() * excuses.length)]; document.getElementById('excuseResultBlock').style.display = 'block'; tg.HapticFeedback.impactOccurred('medium'); }
        function openModal(id) { document.getElementById(id).classList.add('active'); tg.HapticFeedback.impactOccurred('light'); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }

        function refreshApp() {
            const now = new Date(); const day = now.getDay(); const cur = now.getHours() * 60 + now.getMinutes();
            let active = null; let next = null; let slotEnd = "--:--"; let endS = 0;
            if (scheduleData[day]) {
                timeSlots.forEach((slot, i) => {
                    const [sH, sM] = slot.s.split(':').map(Number); const [eH, eM] = slot.e.split(':').map(Number);
                    const s = sH * 60 + sM, e = eH * 60 + eM;
                    if (cur >= s && cur < e) { 
                        active = scheduleData[day][i]; slotEnd = slot.e; 
                        endS = (e * 60) - (now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds());
                        for(let j=i+1; j<scheduleData[day].length; j++){ if(scheduleData[day][j] && scheduleData[day][j]!=="-"){ next=scheduleData[day][j]; break; } }
                    }
                });
            }
            if (active && active !== "-") {
                document.getElementById('lessonName').innerText = active;
                document.getElementById('nextLessonHint').innerText = next ? "ДАЛІ: " + next : "ОСТАННІЙ УРОК";
                let m = Math.floor(endS / 60); let s = endS % 60;
                document.getElementById('countdownTimer').innerText = `00:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
                document.getElementById('miniTimer').innerText = `${m}:${s.toString().padStart(2,'0')}`;
                document.getElementById('endTimeLabel').innerText = "ЗАКІНЧЕННЯ: " + slotEnd;
            } else {
                document.getElementById('lessonName').innerText = (day === 0 || day === 6) ? "ВИХІДНИЙ" : "ПЕРЕРВА";
                document.getElementById('miniTimer').innerText = "OFF";
                document.getElementById('endTimeLabel').innerText = "УРОКИ НЕ ЙДУТЬ";
            }
            // Зміна фрази раз на 2 хвилини
            if (now.getSeconds() === 0 && now.getMinutes() % 2 === 0) {
                document.getElementById('aiPhrase').innerText = aiPhrases[Math.floor(Math.random() * aiPhrases.length)];
                tg.HapticFeedback.notificationOccurred('success');
            }
        }

        function renderSched() {
            let h = ''; const days = ["НЕДІЛЯ", "ПОНЕДІЛОК", "ВІВТОРОК", "СЕРЕДА", "ЧЕТВЕР", "П'ЯТНИЦЯ", "СУБОТА"];
            for(let d = 1; d <= 5; d++) {
                h += `<div style="background:rgba(62,227,92,0.05); border:1px solid var(--border); border-radius:15px; padding:12px;">
                    <div style="color:var(--green); font-size:10px; font-weight:900; margin-bottom:5px;">${days[d]}</div>
                    <div style="display:flex; flex-wrap:wrap; gap:5px;">`;
                scheduleData[d].forEach((l, i) => { if(l!=="-") h+=`<div style="background:rgba(255,255,255,0.05); padding:4px 8px; border-radius:8px; font-size:10px;">${i+1}. ${l}</div>`; });
                h += `</div></div>`;
            }
            document.getElementById('fullSchedule').innerHTML = h;
        }

        function toggleSection(id) { const s = document.getElementById(id); s.style.display = s.style.display==='grid'?'none':'grid'; if(id==='fullSchedule') renderSched(); tg.HapticFeedback.selectionChanged(); }
        function saveIntel() { localStorage.setItem('6a_intel', document.getElementById('intelArea').value); }

        function init() {
            tg.ready(); tg.expand(); document.getElementById('intelArea').value = localStorage.getItem('6a_intel') || "";
            const user = tg.initDataUnsafe?.user; if (user) document.getElementById('uName').innerText = user.first_name;
            document.getElementById('aiPhrase').innerText = aiPhrases[Math.floor(Math.random() * aiPhrases.length)];
            refreshApp(); setInterval(refreshApp, 1000);
        }
        init();
    </script>
</body>
</html>
