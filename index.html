<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>6-А ПОРТАЛ | V1.8.1</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --green: #3EE35C;
            --green-glow: rgba(62, 227, 92, 0.4);
            --bg: #050505;
            --card: rgba(20, 20, 20, 0.8);
            --border: rgba(62, 227, 92, 0.3);
            --text: #ffffff;
            --gen-gradient: linear-gradient(135deg, #00f2fe 0%, #3EE35C 100%);
            --gen-glow: rgba(0, 242, 254, 0.5);
        }

        @keyframes bgMove { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        @keyframes float { 0%, 100% { transform: translateY(0px) rotate(0deg); } 50% { transform: translateY(-8px) rotate(0.3deg); } }
        @keyframes reveal { from { opacity: 0; transform: scale(0.9) translateY(20px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        @keyframes slideInRight { from { transform: translateX(50px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes genPulse { 0%, 100% { box-shadow: 0 0 15px var(--green-glow), 0 0 5px var(--gen-glow); border-color: var(--green); } 50% { box-shadow: 0 0 30px var(--green-glow), 0 0 15px var(--gen-glow); border-color: #fff; } }
        @keyframes genClick { 0% { transform: scale(1); } 50% { transform: scale(0.92) rotate(-2deg); } 100% { transform: scale(1); } }

        body {
            margin: 0; padding: 0; background: var(--bg);
            background-image: radial-gradient(circle at center, #0d1a0d 0%, #050505 100%);
            background-size: cover; color: var(--text); font-family: 'Inter', -apple-system, sans-serif;
            display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow-x: hidden;
            opacity: 0; animation: reveal 1s ease-out forwards;
        }

        #app-root { width: 100%; max-width: 480px; padding: 25px; box-sizing: border-box; }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; animation: slideInRight 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.2s backwards; }
        .header h1 { color: var(--green); margin: 0; font-size: 24px; font-weight: 900; letter-spacing: -0.5px; }
        .brand { font-size: 10px; font-weight: 700; color: #fff; opacity: 0.6; margin: 4px 0; letter-spacing: 1px; }

        .card {
            background: var(--card); border: 2px solid var(--border); backdrop-filter: blur(20px);
            border-radius: 30px; padding: 30px 20px; text-align: center; margin-bottom: 25px;
            animation: reveal 1s ease-out 0.4s backwards, float 6s infinite ease-in-out 1.4s;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            transition: border-color 0.3s;
        }
        .card:hover { border-color: var(--green); }

        .btn-list { display: flex; flex-direction: column; gap: 12px; width: 100%; }
        
        .main-btn {
            background: rgba(255,255,255,0.03); border: 2px solid var(--border); color: #ccc;
            padding: 18px; border-radius: 20px; font-size: 14px; font-weight: 800;
            width: 100%; cursor: pointer; text-transform: uppercase; transition: 0.3s all cubic-bezier(0.4, 0, 0.2, 1);
            display: flex; justify-content: space-between; align-items: center;
            animation: reveal 0.8s ease-out backwards;
            backdrop-filter: blur(5px);
        }
        .main-btn:active { transform: scale(0.97); }
        .main-btn:hover { border-color: var(--green); color: var(--green); background: rgba(62,227,92,0.05); }

        .gen-btn { 
            background: var(--gen-gradient); border: 2px solid #fff; color: #000; font-weight: 950;
            animation: reveal 0.8s ease-out 0.6s backwards, genPulse 4s infinite ease-in-out 1.6s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3); text-shadow: 0 1px 2px rgba(255,255,255,0.5);
        }
        .gen-btn:active { animation: genClick 0.4s ease; }

        .btn-list .main-btn:nth-child(2) { animation-delay: 0.7s; }
        .btn-list .main-btn:nth-child(3) { animation-delay: 0.8s; }
        .btn-list .main-btn:nth-child(4) { animation-delay: 0.9s; }

        .profile-icon {
            width: 45px; height: 45px; border: 2px solid var(--border); border-radius: 15px;
            display: flex; align-items: center; justify-content: center; transition: 0.3s all;
            background: rgba(255,255,255,0.03);
        }

        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.94); backdrop-filter: blur(30px); display: none; z-index: 1000; align-items: flex-end; opacity: 0; transition: opacity 0.3s; }
        .modal.active { display: flex; opacity: 1; }
        .modal-box { 
            background: #080808; width: 100%; padding: 40px 25px; border-radius: 40px 40px 0 0; 
            border-top: 3px solid var(--green); text-align: center;
            transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .modal.active .modal-box { transform: translateY(0); }

        .big-timer { font-family: 'Courier New', monospace; font-size: 50px; font-weight: 900; color: var(--green); margin: 20px 0; text-shadow: 0 0 15px var(--green-glow); }
        .sched-item { background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 12px; padding: 12px; text-align: left; transition: 0.3s; margin-top: 10px; }
    </style>
</head>
<body>

    <div id="app-root">
        <div class="header">
            <div class="header-text">
                <h1>6-А ПОРТАЛ</h1>
                <div class="brand">By : Tarasi4ik & Sensei.Co</div>
            </div>
            <div class="profile-icon" onclick="openModal('profileModal')">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--green)" stroke-width="2.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </div>
        </div>

        <div class="card">
            <div style="font-size: 10px; font-weight: 900; color: var(--green); letter-spacing: 4px; opacity: 0.9;">Статус</div>
            <div id="lessonName" style="font-size: 30px; font-weight: 950; margin: 12px 0;">АНАЛІЗ...</div>
            <div id="nextLessonHint" style="font-size: 12px; opacity: 0.6; font-weight: 600;">LOADING_DATA</div>
        </div>

        <div class="btn-list">
            <button class="main-btn gen-btn" onclick="openModal('excuseModal')">ГЕНЕРАТОР ВІДМАЗОК ✨</button>
            <button class="main-btn" onclick="openModal('timerModal')">ДО КІНЦЯ УРОКУ <span id="miniTimer" style="font-family: monospace; color: var(--green);">00:00</span></button>
            <button class="main-btn" onclick="openModal('freedomModal')">ЧАС ДО СВОБОДИ? 🔓</button>
            <button class="main-btn" onclick="toggleSection('fullSchedule')">РОЗКЛАД 📅</button>
            <div id="fullSchedule" style="display:none;"></div>
        </div>
    </div>

    <div id="timerModal" class="modal" onclick="closeModal('timerModal')"><div class="modal-box" onclick="event.stopPropagation()"><div style="font-size: 11px; font-weight: 900; color: var(--green); letter-spacing: 2px;">УРОК ЗАВЕРШУЄТЬСЯ</div><div id="countdownTimer" class="big-timer">00:00:00</div><button class="main-btn gen-btn" onclick="closeModal('timerModal')" style="justify-content: center; width: auto; margin: 0 auto; padding: 15px 30px;">ЗАКРИТИ</button></div></div>
    <div id="freedomModal" class="modal" onclick="closeModal('freedomModal')"><div class="modal-box" onclick="event.stopPropagation()"><div style="font-size: 11px; font-weight: 900; color: #fff; letter-spacing: 2px;">ДО ПОВНОЇ СВОБОДИ</div><div id="freedomTimer" class="big-timer" style="color: #fff;">00:00:00</div><button class="main-btn gen-btn" onclick="closeModal('freedomModal')" style="justify-content: center; width: auto; margin: 0 auto; padding: 15px 30px;">ТРИМАЮСЬ!</button></div></div>
    <div id="excuseModal" class="modal" onclick="closeModal('excuseModal')"><div class="modal-box" onclick="event.stopPropagation()"><h2 style="color: var(--green); font-weight: 900;">ВІДМАЗКА</h2><button class="main-btn gen-btn" onclick="generateExcuse()" style="justify-content: center; margin-bottom: 25px;">НОВА КАРТА ⚡</button><div id="excuseResultBlock" style="display:none; padding: 25px; border: 2px dashed var(--green); border-radius: 20px; background: rgba(62,227,92,0.08);"><div id="excuseText" style="font-weight: 700; font-size: 17px; line-height: 1.5; color: #fff;"></div></div><button class="main-btn" onclick="closeModal('excuseModal')" style="justify-content: center; margin-top: 30px; border-color: rgba(255,255,255,0.1); color: #888;">ЗАКРИТИ</button></div></div>
    <div id="profileModal" class="modal" onclick="closeModal('profileModal')"><div class="modal-box" onclick="event.stopPropagation()"><h2 id="uName" style="margin:0; font-size: 28px; color: #fff;">Гість</h2><p style="color: var(--green); letter-spacing: 2px; font-size: 12px; margin: 10px 0 35px 0;">АВТОРИЗОВАНИЙ УЧЕНЬ 6-А</p><button class="main-btn gen-btn" onclick="closeModal('profileModal')" style="justify-content: center; width: auto; margin: 0 auto; padding: 15px 30px;">ВИХІД</button></div></div>

    <script>
        const tg = window.Telegram.WebApp;
        const initialExcuses = ["Вимкнули світло 🕯️", "Windows оновлюється 🔄", "Сусіди перфоратором 🛠️", "Кіт вирвав шнур 🐈", "ДЗ самознищився ☣️", "Мишка живе своїм життям 🖱️", "Роутер димить 💨", "Клавіатура в чаї ☕", "Магнітні бурі ☄️"];
        let deck = [...initialExcuses];

        const scheduleData = { 
            1: ["МАТЕМАТИКА", "ІСТОРІЯ", "УКР.МОВА", "УКР.МОВА", "ЗАРУБ. ЛІТ", "МУЗИКА", "МАТЕМАТИКА", "ПРИРОДА"], 
            2: ["МАТЕМАТИКА", "УКР. ЛІТ", "ГРОМАД. ОСВ", "АНГЛ. МОВА", "АНГЛ. МОВА", "ЗАРУБ. ЛІТ", "ІНФОРМАТИКА"], 
            3: ["МАТЕМАТИКА", "ІНФОРМАТИКА", "ГЕОГРАФІЯ", "УКР.МОВА", "УКР.МОВА", "ІСТОРІЯ", "ХОРЕОГРАФ"], 
            4: ["МАТЕМАТИКА", "УКР. ЛІТ", "ЗДОРОВ'Я", "АНГЛ. МОВА", "АНГЛ. МОВА", "ФІЗКУЛЬТУРА"], 
            5: ["-", "ЗДОРОВ'Я", "ГЕОГРАФІЯ", "ФІЗКУЛЬТУРА", "ПРИРОДА", "ТЕХНОЛОГІЇ", "АНГЛ. МОВА"] // ВИПРАВЛЕНО ТУТ
        };

        const timeSlots = [{s:"08:15", e:"08:55"}, {s:"09:00", e:"09:40"}, {s:"09:50", e:"10:30"}, {s:"10:40", e:"11:20"}, {s:"11:40", e:"12:20"}, {s:"12:30", e:"13:10"}, {s:"13:20", e:"14:00"}, {s:"14:10", e:"14:50"}];

        function generateExcuse() { if(!deck.length) deck=[...initialExcuses]; const idx=Math.floor(Math.random()*deck.length); document.getElementById('excuseText').innerText=deck.splice(idx,1)[0]; document.getElementById('excuseResultBlock').style.display='block'; tg.HapticFeedback.impactOccurred('rigid'); }
        function openModal(id) { document.getElementById(id).classList.add('active'); tg.HapticFeedback.impactOccurred('light'); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }

        function refreshApp() {
            const now = new Date(); const day = now.getDay(); const curSec = now.getHours()*3600 + now.getMinutes()*60 + now.getSeconds(); const curMin = now.getHours()*60 + now.getMinutes();
            let active = null, next = null;
            if(scheduleData[day]) {
                const lessons = scheduleData[day];
                let lastIdx = -1;
                for(let k=lessons.length-1; k>=0; k--) if(lessons[k] && lessons[k]!=="-") { lastIdx=k; break; }
                if(lastIdx!==-1) {
                    const lastSecs = timeSlots[lastIdx].e.split(':').reduce((h,m)=>h*3600+m*60);
                    let diff = Math.max(0, lastSecs-curSec);
                    document.getElementById('freedomTimer').innerText = `${Math.floor(diff/3600).toString().padStart(2,'0')}:${Math.floor((diff%3600)/60).toString().padStart(2,'0')}:${(diff%60).toString().padStart(2,'0')}`;
                }
                timeSlots.forEach((slot, i) => {
                    const s = slot.s.split(':').reduce((h,m)=>h*60+m*1), e = slot.e.split(':').reduce((h,m)=>h*60+m*1);
                    if(curMin >= s && curMin < e) {
                        active = lessons[i]; let ds = (e*60)-curSec;
                        document.getElementById('miniTimer').innerText = `${Math.floor(ds/60)}:${(ds%60).toString().padStart(2,'0')}`;
                        document.getElementById('countdownTimer').innerText = `00:${Math.floor(ds/60).toString().padStart(2,'0')}:${(ds%60).toString().padStart(2,'0')}`;
                        for(let j=i+1; j<lessons.length; j++) if(lessons[j] && lessons[j]!=="-") { next=lessons[j]; break; }
                    }
                });
            }
            document.getElementById('lessonName').innerText = (active && active!=="-") ? active : ((day===0||day===6)?"ВИХІДНИЙ":"ПЕРЕРВА");
            document.getElementById('nextLessonHint').innerText = next ? "ДАЛІ: "+next : "ВІЛЬНИЙ ЧАС";
        }

        function toggleSection(id) {
            const s = document.getElementById(id);
            if(s.style.display==='none') {
                let h='', days=["","ПОНЕДІЛОК","ВІВТОРОК","СЕРЕДА","ЧЕТВЕР","П'ЯТНИЦЯ"];
                for(let d=1; d<=5; d++) {
                    h += `<div class="sched-item"><div style="color:var(--green); font-size:11px; font-weight:900; margin-bottom:7px;">${days[d]}</div><div style="display:flex; flex-wrap:wrap; gap:6px;">`;
                    scheduleData[d].forEach((l,i) => { h+=`<div style="background:rgba(255,255,255,0.06); padding:5px 10px; border-radius:10px; font-size:10px;">${i}. ${l}</div>`; });
                    h += `</div></div>`;
                }
                s.innerHTML=h; s.style.display='grid';
            } else s.style.display='none';
            tg.HapticFeedback.selectionChanged();
        }

        tg.ready(); tg.expand();
        const user = tg.initDataUnsafe?.user; if(user) document.getElementById('uName').innerText = user.first_name;
        refreshApp(); setInterval(refreshApp, 1000);
    </script>
</body>
</html>
