<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>6-А ПОРТАЛ | V1.1.2</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --green: #3EE35C;
            --green-glow: rgba(62, 227, 92, 0.5);
            --bg: #050505;
            --card: rgba(15, 15, 15, 0.85);
            --border: rgba(62, 227, 92, 0.25);
            --text: #ffffff;
        }

        /* --- ЕФЕКТ "ПЛИННОСТІ" (LIQUID FLOW) --- */
        @keyframes bgMove { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        
        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); }
            33% { transform: translateY(-10px) scale(1.01); }
            66% { transform: translateY(5px) scale(0.99); }
        }

        @keyframes liquidReveal {
            0% { opacity: 0; filter: blur(20px); transform: translateY(30px) scale(0.8); }
            100% { opacity: 1; filter: blur(0); transform: translateY(0) scale(1); }
        }

        @keyframes glitch {
            0%, 90% { transform: none; text-shadow: none; }
            92% { transform: skewX(12deg); text-shadow: 2px 0 red; }
            95% { transform: skewX(-12deg); text-shadow: -2px 0 blue; }
            100% { transform: none; }
        }

        body {
            margin: 0; padding: 0; background: var(--bg);
            background-image: linear-gradient(-45deg, #050505, #0a110a, #050505, #081008);
            background-size: 400% 400%; animation: bgMove 15s ease infinite;
            color: var(--text); font-family: 'Inter', sans-serif;
            display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow-x: hidden;
        }

        #app-root { width: 100%; max-width: 500px; padding: 25px; box-sizing: border-box; z-index: 10; }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; animation: liquidReveal 1s cubic-bezier(0.2, 0.8, 0.2, 1); }
        .header h1 { color: var(--green); margin: 0; font-size: 28px; font-weight: 950; text-shadow: 0 0 15px var(--green-glow); animation: glitch 10s infinite; }

        /* ПОВЕРНУЛИ ПРОФІЛЬ */
        .profile-btn {
            width: 52px; height: 52px; border: 2.5px solid var(--green); border-radius: 18px;
            display: flex; align-items: center; justify-content: center; background: rgba(62, 227, 92, 0.05);
            box-shadow: 0 0 15px var(--green-glow); transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .profile-btn:active { transform: scale(0.8) rotate(-10deg); }

        .card {
            background: var(--card); border: 1px solid var(--border); backdrop-filter: blur(30px);
            border-radius: 40px; padding: 35px 25px; text-align: center; margin-bottom: 20px;
            animation: liquidReveal 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) backwards, float 8s infinite ease-in-out;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }

        .label-top { color: var(--green); font-size: 11px; font-weight: 900; letter-spacing: 4px; text-transform: uppercase; margin-bottom: 15px; opacity: 0.8; }
        #lessonName { font-size: 44px; font-weight: 950; margin: 10px 0; text-transform: uppercase; line-height: 0.9; text-shadow: 0 0 20px var(--green-glow); }
        #nextLessonHint { font-size: 13px; color: var(--green); font-weight: 700; margin-top: 15px; opacity: 0.6; letter-spacing: 1px; }

        .progress-container { width: 100%; height: 6px; background: rgba(255,255,255,0.05); border-radius: 20px; margin-top: 25px; overflow: hidden; display: none; }
        #lessonProgress { width: 0%; height: 100%; background: var(--green); box-shadow: 0 0 15px var(--green); transition: width 1s linear; }

        .main-btn {
            background: var(--green); color: #000; border: none; padding: 22px; border-radius: 25px;
            font-size: 16px; font-weight: 950; width: 100%; cursor: pointer; text-transform: uppercase;
            margin-bottom: 15px; transition: 0.3s; box-shadow: 0 8px 25px var(--green-glow);
            animation: liquidReveal 1s 0.3s backwards;
        }
        .main-btn:active { transform: scale(0.96); box-shadow: 0 2px 10px var(--green-glow); }
        .secondary-btn { background: none; border: 2px solid var(--green); color: var(--green); box-shadow: none; }

        #intelSection { display: none; width: 100%; animation: liquidReveal 0.5s; margin-bottom: 20px; }
        #intelArea { width: 100%; background: rgba(0,0,0,0.7); border: 2px solid var(--green); border-radius: 20px; color: var(--green); padding: 20px; font-family: monospace; outline: none; box-sizing: border-box; }

        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.96); backdrop-filter: blur(40px); display: none; z-index: 1000; align-items: flex-end; }
        .modal.active { display: flex; }
        .modal-box { 
            background: #080808; width: 100%; padding: 60px 30px; border-radius: 50px 50px 0 0; 
            border-top: 3px solid var(--green); text-align: center; animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1); 
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        .u-avatar { width: 120px; height: 120px; border-radius: 40px; border: 3px solid var(--green); margin-bottom: 20px; box-shadow: 0 0 40px var(--green-glow); }
    </style>
</head>
<body>

    <div id="app-root">
        <div class="header">
            <div>
                <h1>6-А ПОРТАЛ</h1>
                <div style="font-size: 10px; color: var(--green); font-weight: 800; opacity: 0.5; letter-spacing: 3px;">V1.1.2 FINAL</div>
            </div>
            <div class="profile-btn" onclick="openModal()">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="var(--green)" stroke-width="3"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </div>
        </div>

        <div class="card">
            <div class="label-top">Поточний Урок</div>
            <div id="lessonName">АНАЛІЗ...</div>
            
            <div id="pBarContainer" class="progress-container">
                <div id="lessonProgress"></div>
            </div>
            
            <div id="nextLessonHint">ОЧІКУВАННЯ ДАНИХ...</div>
        </div>

        <button class="main-btn secondary-btn" onclick="toggleSchedule()">АРХІВ ДАНИХ (РОЗКЛАД)</button>
        <div id="fullSchedule" style="display:none; width: 100%; margin-bottom: 20px;"></div>

        <button class="main-btn secondary-btn" onclick="toggleIntel()">ОСОБИСТІ ДАНІ (НОТАТКИ)</button>
        <div id="intelSection">
            <textarea id="intelArea" rows="4" placeholder="Введіть секретні нотатки..." oninput="saveIntel()"></textarea>
        </div>

        <div class="card" style="padding: 20px; animation-delay: 0.4s;">
            <div style="font-size: 50px; font-weight: 900; letter-spacing: -2px;" id="countVal">18</div>
            <div style="font-size: 10px; opacity: 0.5; font-weight: 800; text-transform: uppercase; letter-spacing: 2px;">Система активна</div>
        </div>
    </div>

    <div id="profileModal" class="modal" onclick="closeModal()">
        <div class="modal-box" onclick="event.stopPropagation()">
            <img id="avatarImg" src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" class="u-avatar">
            <h2 id="uName" style="margin:0; font-size: 36px; font-weight: 900;">Гість</h2>
            <p id="uTag" style="color: var(--green); font-weight: 700; margin-bottom: 40px; font-size: 18px;">@6a_user</p>
            <button class="main-btn" onclick="closeModal()">ПОВЕРНУТИСЯ</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        const scheduleData = {
            1: ["Математика", "Історія", "Укр.мова", "Укр.мова", "Заруб. літ-ра", "Музика", "Математика", "Природа"],
            2: ["Математика", "Укр. літ-ра", "Громад. освіта", "Англ. мова", "Англ. мова", "Заруб. літ-ра", "Інформатика"],
            3: ["Математика", "Інформатика", "Географія", "Укр.мова", "Укр.мова", "Історія", "Хореограф"],
            4: ["Математика", "Укр. літ-ра", "Здоров'я, доброб", "Англ. мова", "Англ. мова", "Фізкультура"],
            5: ["-", "Здоров'я, добробут", "Географія", "Фізкультура", "Природа", "Технології", "Англ. мова"]
        };

        const timeSlots = [
            { s: "08:15", e: "08:55" }, { s: "09:00", e: "09:40" }, { s: "09:50", e: "10:30" },
            { s: "10:40", e: "11:20" }, { s: "11:40", e: "12:20" }, { s: "12:30", e: "13:10" },
            { s: "13:20", e: "14:00" }, { s: "14:10", e: "14:50" }
        ];

        function refreshApp() {
            const now = new Date();
            const day = now.getDay();
            const cur = now.getHours() * 60 + now.getMinutes();
            let active = null;
            let next = null;
            let sT = 0, eT = 0;

            if (scheduleData[day]) {
                timeSlots.forEach((slot, i) => {
                    const [sH, sM] = slot.s.split(':').map(Number);
                    const [eH, eM] = slot.e.split(':').map(Number);
                    const s = sH * 60 + sM, e = eH * 60 + eM;
                    
                    if (cur >= s && cur < e) {
                        active = scheduleData[day][i];
                        sT = s; eT = e;
                        // Шукаємо наступний урок
                        for(let j = i + 1; j < scheduleData[day].length; j++) {
                            if (scheduleData[day][j] && scheduleData[day][j] !== "-") {
                                next = scheduleData[day][j];
                                break;
                            }
                        }
                    }
                });
                
                // Якщо зараз перерва, знайдемо найближчий майбутній урок
                if (!active) {
                    for(let i = 0; i < timeSlots.length; i++) {
                        const [sH, sM] = timeSlots[i].s.split(':').map(Number);
                        if (cur < (sH * 60 + sM)) {
                            if (scheduleData[day][i] && scheduleData[day][i] !== "-") {
                                next = scheduleData[day][i];
                                break;
                            }
                        }
                    }
                }
            }

            const nD = document.getElementById('lessonName');
            const hD = document.getElementById('nextLessonHint');
            const pB = document.getElementById('lessonProgress');
            const pC = document.getElementById('pBarContainer');

            if (active && active !== "-") {
                nD.innerText = active;
                pC.style.display = "block";
                pB.style.width = ((cur - sT) / (eT - sT) * 100) + "%";
                hD.innerText = next ? "ДАЛІ: " + next : "ЦЕ ОСТАННІЙ УРОК";
            } else {
                nD.innerText = (day === 0 || day === 6) ? "ВИХІДНИЙ" : "ПЕРЕРВА";
                pC.style.display = "none";
                hD.innerText = next ? "НАСТУПНИЙ: " + next : "УРОКИ ЗАКІНЧЕНО";
            }
        }

        function toggleSchedule() {
            const s = document.getElementById('fullSchedule');
            s.style.display = s.style.display === 'block' ? 'none' : 'block';
            if (s.innerHTML === "") renderSched();
            tg.HapticFeedback.impactOccurred('medium');
        }

        function renderSched() {
            let h = '';
            const days = ["", "ПОНЕДІЛОК", "ВІВТОРОК", "СЕРЕДА", "ЧЕТВЕР", "П'ЯТНИЦЯ"];
            for(let d=1; d<=5; d++) {
                h += `<div style="background:rgba(255,255,255,0.03); padding:20px; border-radius:25px; margin-bottom:15px; border:1px solid var(--border); animation: liquidReveal 0.5s;">
                <div style="color:var(--green); font-weight:950; font-size:14px; letter-spacing:2px;">${days[d]}</div>`;
                scheduleData[d].forEach((l, i) => { if(l !== "-") h += `<div style="font-size:13px; opacity:0.8; margin-top:5px;">${i}. ${l}</div>` });
                h += `</div>`;
            }
            document.getElementById('fullSchedule').innerHTML = h;
        }

        function toggleIntel() {
            const s = document.getElementById('intelSection');
            s.style.display = s.style.display === 'block' ? 'none' : 'block';
            tg.HapticFeedback.impactOccurred('light');
        }

        function saveIntel() { localStorage.setItem('6a_intel', document.getElementById('intelArea').value); }
        function openModal() { document.getElementById('profileModal').classList.add('active'); tg.HapticFeedback.impactOccurred('medium'); }
        function closeModal() { document.getElementById('profileModal').classList.remove('active'); }

        function init() {
            tg.ready(); tg.expand();
            document.getElementById('intelArea').value = localStorage.getItem('6a_intel') || "";
            const user = tg.initDataUnsafe?.user;
            if (user) {
                document.getElementById('uName').innerText = user.first_name;
                document.getElementById('uTag').innerText = user.username ? "@" + user.username : "ID: " + user.id;
                if (user.photo_url) document.getElementById('avatarImg').src = user.photo_url;
            }
            refreshApp(); setInterval(refreshApp, 10000);
        }
        init();
    </script>
</body>
</html>
